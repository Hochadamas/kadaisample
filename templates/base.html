<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}テスマエ！{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('index') }}" class="logo">テスマエ<span>！</span></a>
    <p class="tagline">テスト前の「わからない」を、みんなで解決。</p>
    <nav>
      <a href="{{ url_for('index') }}">質問一覧</a>
      <a href="{{ url_for('about') }}">ルール</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>© Hochadamas ・ テスマエ！ ・ 保存先：{{ storage_mode }}</p>
  </footer>
</body>
</html>
